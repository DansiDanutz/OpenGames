# Tells the owner when the public server does not answer. Off until the variable PLAY_DOMAIN is set.
name: health
on:
  schedule: [{ cron: "17 */4 * * *" }]
  workflow_dispatch:
permissions: {}
jobs:
  health:
    if: vars.PLAY_DOMAIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 4 --retry-delay 20 --retry-all-errors -m 15 "https://$PLAY_DOMAIN/health"
        env: { PLAY_DOMAIN: "${{ vars.PLAY_DOMAIN }}" }
