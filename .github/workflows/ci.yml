name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, windows-latest] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 26 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - name: Pack
        run: node tools/pack.js --server wss://play.example.org --dir
      - name: Packed app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node test/packed.e2e.js "$PWD/dist/linux-unpacked/opengames"
      - name: Packed app (Windows)
        if: runner.os == 'Windows'
        run: node test/packed.e2e.js "$PWD/dist/win-unpacked/OpenGames.exe"
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - run: docker build -f deploy/Dockerfile -t opengames-server .
      - name: The server answers, through Caddy and without rights
        run: |
          PLAY_DOMAIN=localhost docker compose -f deploy/compose.yml up -d --build
          for i in $(seq 1 30); do curl -ksf https://localhost/health && break; sleep 2; done
          curl -ksf https://localhost/health
          curl -ksf "https://localhost/leaderboard?game=shikaku"
          docker compose -f deploy/compose.yml exec -T server id -u | grep -qx 1000
          docker compose -f deploy/compose.yml down -t 10
        env: { PLAY_DOMAIN: localhost }
