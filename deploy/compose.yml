# PLAY_DOMAIN=play.example.org docker compose -f deploy/compose.yml up -d --build
services:
  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    ulimits: { nofile: 65536 }
    sysctls: { net.core.somaxconn: 4096 }
    tmpfs: [/tmp]
    volumes: ["data:/data"]
    ports: ["3478:3478/udp"]        # STUN goes past the proxy; 4310 is for Caddy only
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment: { PLAY_DOMAIN: "${PLAY_DOMAIN:?set PLAY_DOMAIN}" }
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "certs:/data"]
    depends_on: [server]
volumes: { data: {}, certs: {} }
